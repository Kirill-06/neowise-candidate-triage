<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #notice { margin: 1rem 0 .5rem; padding: .6rem .8rem; border-radius: .3rem; }
    #notice:empty { display: none; }
    #notice.warn { background: #fff4d6; border-left: 4px solid #e0a800; }
    #notice.error { background: #fde8e8; border-left: 4px solid #c0392b; }
    #draft-block[hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>

  <div id="notice" role="status" aria-live="polite"></div>

  <section id="draft-block" hidden>
    <p>Тема: <strong id="topic"></strong></p>
    <label for="draft">Черновик ответа (проверьте перед отправкой)</label>
    <textarea id="draft" rows="5"></textarea>
  </section>

  <script type="module">
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цены", other: "Другое" };

    const form = document.querySelector("form");
    const button = form.querySelector("button");
    const message = document.querySelector("#message");
    const notice = document.querySelector("#notice");
    const draftBlock = document.querySelector("#draft-block");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");

    function showNotice(text, kind = "") {
      notice.textContent = text;
      notice.className = kind;
    }

    function clearDraft() {
      draftBlock.hidden = true;
      topic.textContent = "";
      draft.value = "";
    }

    function render(status, body) {
      if (status === 200 && body.status === "ready") {
        showNotice("");
        topic.textContent = TOPIC_LABELS[body.topic] ?? body.topic;
        draft.value = body.draft;
        draftBlock.hidden = false;
        return;
      }
      clearDraft();
      if (body.status === "manual_review") {
        showNotice("AI не смог разобрать заявку. Прочитайте её и ответьте клиенту вручную.", "warn");
      } else if (body.status === "invalid_input") {
        showNotice("Введите текст заявки.", "error");
      } else {
        showNotice("Сервис недоступен. Разберите заявку вручную.", "error");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      // старый черновик убираем сразу, чтобы его не отправили по ошибке к новой заявке
      clearDraft();
      const text = message.value.trim();
      if (!text) {
        showNotice("Введите текст заявки.", "error");
        return;
      }

      showNotice("Разбираем заявку…");
      button.disabled = true;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        render(reply.status, await reply.json());
      } catch {
        render(0, {});
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
